# /etc/nginx/sites-available/chheda-api.conf  →  ln -s into sites-enabled
# TLS certificates are created by: certbot --nginx -d api.chhedajewellers.com
map $http_x_request_id $req_id { default $http_x_request_id; "" $request_id; }

server {
    listen 80;
    server_name api.chhedajewellers.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.chhedajewellers.com;

    ssl_certificate     /etc/letsencrypt/live/api.chhedajewellers.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.chhedajewellers.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    server_tokens off;

    client_max_body_size 2m;          # CSV import is the largest request
    gzip on; gzip_types application/json text/csv text/plain;
    access_log /var/log/nginx/chheda-api.access.log;

    # Meta webhooks: allowed, generous limit (the app also rate-limits and verifies signatures)
    location /api/v1/webhooks/ {
        limit_req zone=webhooks burst=100 nodelay;
        proxy_pass http://127.0.0.1:4000;
        include /etc/nginx/snippets/chheda-proxy.conf;
    }
    # public images (only with STORAGE_DRIVER=local) – long cache
    location /media/ {
        proxy_pass http://127.0.0.1:4000;
        include /etc/nginx/snippets/chheda-proxy.conf;
        expires 365d;
    }
    location / {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://127.0.0.1:4000;
        include /etc/nginx/snippets/chheda-proxy.conf;
    }
}
