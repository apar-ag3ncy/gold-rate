# /etc/nginx/sites-available/chheda.conf – ONE domain for dashboard + API on the same server (deploy/oracle/setup.sh fills __DOMAIN__).
# certbot --nginx -d __DOMAIN__  adds the https block and the http→https redirect.
map $http_x_request_id $req_id { default $http_x_request_id; "" $request_id; }

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    server_tokens off;
    client_max_body_size 2m;          # CSV paste of WhatsApp numbers is the largest request
    gzip on; gzip_types application/json text/css application/javascript text/plain image/svg+xml;
    access_log /var/log/nginx/chheda.access.log;

    # Meta webhooks – generous limit (the app also rate-limits and checks signatures)
    location /api/v1/webhooks/ {
        limit_req zone=webhooks burst=100 nodelay;
        proxy_pass http://127.0.0.1:4000;
        include /etc/nginx/snippets/chheda-proxy.conf;
    }
    # API – straight to Express (same origin as the dashboard, so the session cookie stays first-party)
    location /api/v1/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://127.0.0.1:4000;
        include /etc/nginx/snippets/chheda-proxy.conf;
    }
    # rate images (STORAGE_DRIVER=local) – Instagram downloads them from here
    location /media/ {
        proxy_pass http://127.0.0.1:4000;
        include /etc/nginx/snippets/chheda-proxy.conf;
        expires 365d;
    }
    location = /health {
        proxy_pass http://127.0.0.1:4000;
        include /etc/nginx/snippets/chheda-proxy.conf;
    }
    # dashboard (Next.js)
    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/chheda-proxy.conf;
    }
}
